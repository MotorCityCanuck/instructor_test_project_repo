release:
  release_name: napa_250k
  expected_player_scale: 250000
  role: production

schemas:
  raw: ${runtime.team_prefix}_250k_raw
  operations: ${objects.operations_schema}

volumes:
  raw:
    name: ${objects.raw_volume_name}
    path: /Volumes/${runtime.catalog}/${schemas.raw}/${objects.raw_volume_name}
  artifacts:
    name: ${objects.artifacts_volume_name}
    path: /Volumes/${runtime.catalog}/${schemas.operations}/${objects.artifacts_volume_name}

artifacts:
  root_path: ${volumes.artifacts.path}/raw_certification/${release.release_name}

performance:
  shuffle_partitions: auto

profiles:
  release_specific:
    minimum_viable_teams_per_country_division: 300
    minimum_recent_matches_per_candidate_team: 12
    minimum_assessment_periods_for_development_probe: 4
    minimum_ranking_players_per_country: 500
    minimum_player_candidates_per_country_division: 50
    minimum_alternate_players_per_country_division: 10
    minimum_partnerships_with_repeat_matches: 200
    minimum_distinct_candidate_teams_per_country_division: 25
