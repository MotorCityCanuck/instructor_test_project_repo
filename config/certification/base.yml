project:
  name: napa_olympic_analytics
  pipeline_name: raw_certification
  pipeline_version: "1.0.0"
  processing_mode: certification

runtime:
  catalog: workspace
  team_prefix: instructor
  default_release: napa_5k
  timezone: America/New_York

objects:
  raw_volume_name: napa_files
  operations_schema: ${runtime.team_prefix}_ops
  artifacts_volume_name: certification_artifacts

execution:
  fail_fast: false
  publish_findings_before_gate: true
  persist_results: true
  publish_report: true
  persist_artifacts: true
  create_missing_managed_objects: true
  fail_on: blocker

manifest:
  enabled: true
  optional: true
  file_names:
    - release_manifest.json
    - manifest.json

profiles:
  common:
    minimum_active_player_rate_blocker: 0.60
    maximum_zero_match_active_player_rate: 0.35
    minimum_player_rating_coverage_rate: 0.70
    minimum_confidence_coverage_rate: 0.50
    minimum_development_players_with_history: 1
    minimum_quality_issue_rows_for_learning: 1
    maximum_quality_issue_rate_for_learning: 0.25
    maximum_source_row_count_relative_diff: 0.01
    maximum_status_distribution_pct_diff: 0.05
    maximum_rating_average_diff: 0.25
    maximum_prior_release_active_rate_drift: 0.20
    minimum_candidate_pool_regression_ratio: 0.50
